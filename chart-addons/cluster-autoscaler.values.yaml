# Values of the Cluster Autoscaler chart (kubernetes/autoscaler, cluster-autoscaler 9.59.0).
# Installed by scripts/helm_addons.sh, run by the deployment build project (task 3.7).
#
# Not in this file, passed by the script from the environment of the build:
#   autoDiscovery.clusterName    the cluster name. The chart builds the two discovery tags from it
#                                (k8s.io/cluster-autoscaler/enabled and k8s.io/cluster-autoscaler/<cluster>),
#                                which the node group of the cluster stack carries.
#   awsRegion                    the region of the cluster.

cloudProvider: aws

replicaCount: 1

# The image is NOT the chart default (appVersion 1.35.0). The autoscaler must run the same minor version as
# the cluster. Release 1.37.0 was not published when this was written (2026-10-08), so this is the newest
# published release, one minor behind a 1.37 cluster. scripts/helm_addons.sh refuses to install it on a
# cluster of another minor unless ALLOW_AUTOSCALER_MINOR_SKEW=true (stack parameter AllowAutoscalerMinorSkew).
# When 1.37.0 exists: change the tag here, check the chart version, and update the pins in the script.
image:
  repository: registry.k8s.io/autoscaling/cluster-autoscaler
  tag: v1.36.1

# AWS credentials come from EKS Pod Identity (association created by the cluster stack for this service
# account), so the service account carries no annotations.
rbac:
  serviceAccount:
    create: true
    name: cluster-autoscaler
    annotations: {}

extraArgs:
  logtostderr: true
  stderrthreshold: info
  v: 2
  expander: least-waste
  scale-down-unneeded-time: 10m
  balance-similar-node-groups: true
  skip-nodes-with-local-storage: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
