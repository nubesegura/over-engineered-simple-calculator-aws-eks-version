name: Deploy

# Reusable deployment (infrastructure-only subset of task 4.8) for dev and prod. prod runs only from the main branch
# and only through deploy-prod.yml, which calls this workflow twice: first with dry_run (plan only: change sets with
# the guard, the cluster version check; nothing is executed), then, if that passed, for real.
# Deploys the stacks of templates/stacks.json up to and including `storage` with change sets guarded
# against removals and replacements (scripts/cfn_deploy.py; only the bastion may replace its instance), then
# runs the CodeBuild deployment project with DEPLOY_COMMAND=addons, builds and pushes the image (linux/arm64,
# immutable tag, deployed by digest only) and runs the project again with DEPLOY_COMMAND=deploy. The last stack,
# `alarms`, is deployed after the release: its dimensions (node group, load balancer, target groups) are found by
# tag once the Helm step has created them (scripts/discover_targets.py), so it follows a recreated cluster.
# The deployment role has PowerUserAccess: no IAM change.
#
# SAM build: the runner has Python 3.14 (setup-python), the runtime of both functions, so `sam build` builds
# natively and no container is used.
on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: dev or prod (prod only from the main branch)"
        type: string
        required: true
      ignore_nat_window:
        description: "Deploy the cluster units even when the NAT gateway may be down (outside 08:00-20:30 Panama; dev only)"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Plan only: create and check the change sets and the cluster version, execute nothing (entry gate of prod)"
        type: boolean
        required: false
        default: false
    secrets:
      ROLE_ARN:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      SUPPORT_EMAIL:
        required: true

permissions:
  id-token: write # Required for requesting the JWT for AWS OIDC
  contents: read

env:
  PYTHON_VERSION: "3.14"
  CFN_LINT_VERSION: "1.48.1"
  SAM_CLI_VERSION: "1.158.0"
  LAST_UNIT: alarms # last stack of templates/stacks.json; it is deployed on its own after the Helm step (--only), the others before (--through storage)

jobs:
  deploy:
    name: ${{ inputs.dry_run && 'Plan' || 'Deploy' }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      # The caller's ref: prod is deployed from main only (the owner merges develop into main).
      - name: Refuse unsupported environments and prod outside main
        env:
          TARGET: ${{ inputs.environment }}
          REF: ${{ github.ref }}
        run: |
          case "$TARGET" in
            dev) ;;
            prod)
              if [ "$REF" != "refs/heads/main" ]; then
                echo "::error::prod is deployed from the main branch only (this run uses '$REF')"
                exit 1
              fi
              ;;
            *)
              echo "::error::Environment '$TARGET' is not supported: use dev or prod"
              exit 1
              ;;
          esac

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The units after rotation need the NAT gateway (nodes pull images); the scheduler turns it off at 22:00.
      - name: Validate environment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN_SET: ${{ secrets.ROLE_ARN != '' }}
          AWS_ACCOUNT_ID_SET: ${{ secrets.AWS_ACCOUNT_ID != '' }}
          SUPPORT_EMAIL_SET: ${{ secrets.SUPPORT_EMAIL != '' }}
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
          WAF_ACL_ARN_VAR: ${{ vars.WAF_ACL_ARN }}
        run: |
          missing=0
          for variable in COGNITO_USER_POOL_ID COGNITO_APP_CLIENT_ID; do
            [ -n "${!variable}" ] || { echo "::error::Variable '$variable' is not set in the '$ENVIRONMENT' GitHub environment"; missing=1; }
          done
          if [ "$ENVIRONMENT" = "prod" ]; then
            [ -n "$WAF_ACL_ARN_VAR" ] || { echo "::error::Variable 'WAF_ACL_ARN' is not set in the 'prod' GitHub environment (the chart requires the web ACL in prod)"; missing=1; }
          fi
          web_origin=$(jq -r '.Parameters.WebOrigin // empty' "parameters/${ENVIRONMENT}.json")
          [ -n "$web_origin" ] || { echo "::error::WebOrigin is empty in parameters/${ENVIRONMENT}.json"; missing=1; }
          echo "WEB_ORIGIN=$web_origin" >> "$GITHUB_ENV"
          [ -n "$AWS_REGION" ] || { echo "::error::Variable 'AWS_REGION' is not set in the '$ENVIRONMENT' GitHub environment"; missing=1; }
          for secret in ROLE_ARN AWS_ACCOUNT_ID SUPPORT_EMAIL; do
            flag="${secret}_SET"
            [ "${!flag}" = "true" ] || { echo "::error::Secret '$secret' is not set in the '$ENVIRONMENT' GitHub environment"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install tooling (pinned)
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-dev.txt
          python -m pip install --disable-pip-version-check "cfn-lint==${CFN_LINT_VERSION}" "aws-sam-cli==${SAM_CLI_VERSION}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          role-session-name: gha-deploy-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify target AWS account
        env:
          EXPECTED_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACTUAL_ACCOUNT"
          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::The credentials do not point to the AWS account configured for the $ENVIRONMENT GitHub environment"
            exit 1
          fi

      # Fails closed: exit 2 (owned by Terraform), 3 (both) and 4 (unreadable) stop the deployment.
      - name: NAT window preflight
        env:
          IGNORE_NAT_WINDOW: ${{ inputs.ignore_nat_window }}
        run: |
          flag=""
          [ "$IGNORE_NAT_WINDOW" = "true" ] && flag="--ignore"
          python3 scripts/nat_window.py check --env "$ENVIRONMENT" --through "$LAST_UNIT" $flag

      - name: Owner guard (CloudFormation only)
        run: python scripts/iac_owner_guard.py check --tool cloudformation --env "$ENVIRONMENT"

      - name: Package the rotation function
        run: python scripts/package_rotation.py

      # Plan only (dry_run): the entry gate of prod. Same guard as the real deployment, nothing is executed. The
      # alarms stack is not part of it: its dimensions exist only after the release (it keeps its own guard).
      - name: Check the Kubernetes version (plan only)
        if: ${{ inputs.dry_run }}
        run: python scripts/eks_latest_version.py --env "$ENVIRONMENT"

      - name: Dry run of the stacks, change sets without executing (plan only)
        if: ${{ inputs.dry_run }}
        env:
          CFN_PARAM_SupportEmail: ${{ secrets.SUPPORT_EMAIL }}
        run: python scripts/cfn_deploy.py deploy --env "$ENVIRONMENT" --through storage --dry-run

      # Change sets: Remove actions and replacements stop the run before the change set is executed.
      - name: Deploy the stacks (security through storage)
        if: ${{ !inputs.dry_run }}
        env:
          CFN_PARAM_SupportEmail: ${{ secrets.SUPPORT_EMAIL }}
        run: python scripts/cfn_deploy.py deploy --env "$ENVIRONMENT" --through storage

      # Zips scripts/, chart-addons/ (and chart/ when it exists), uploads it under <repo-name>/<env>/ of the SAM
      # artifact bucket, starts the CodeBuild project with the SHA-256 and waits. A failed build fails the job.
      - name: Install the cluster add-ons (CodeBuild, command addons)
        if: ${{ !inputs.dry_run }}
        run: python scripts/run_deploy_build.py run --env "$ENVIRONMENT" --command addons

      # The image is built the same way as in the CI image job (linux/arm64 under QEMU) and pushed to the ECR
      # repository of the registry stack with an immutable tag. Only the repository name and the digest are printed.
      - name: Set up QEMU (arm64)
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the image registry (ECR)
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          repository_uri=$(python scripts/cfn_deploy.py output --env "$ENVIRONMENT" --unit registry --key RepositoryUri)
          repository_name=$(python scripts/cfn_deploy.py output --env "$ENVIRONMENT" --unit registry --key RepositoryName)
          registry="${repository_uri%%/*}"
          echo "::add-mask::$registry"
          echo "::add-mask::$repository_uri"
          {
            echo "REPOSITORY_URI=$repository_uri"
            echo "REPOSITORY_NAME=$repository_name"
            echo "IMAGE_TAG=${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry" > /dev/null

      - name: Build and push the image (immutable tag, digest)
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --build-context rotation=src/rotation \
            -f src/backend/Dockerfile --tag "${REPOSITORY_URI}:${IMAGE_TAG}" \
            --push --metadata-file "$RUNNER_TEMP/image-metadata.json" src/backend > /dev/null
          digest=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/image-metadata.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::The build did not report an image digest"; exit 1; }
          registered=$(aws ecr describe-images --repository-name "$REPOSITORY_NAME" --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)
          [ "$registered" = "$digest" ] || { echo "::error::The registry digest differs from the build digest"; exit 1; }
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Image pushed: repository $REPOSITORY_NAME, digest $digest"
          { echo ""; echo "- Image: repository \`$REPOSITORY_NAME\`, digest \`$digest\`"; } >> "$GITHUB_STEP_SUMMARY"

      # The release uses the digest only (never a tag). Values are passed with --pass (read from the environment,
      # allow-list only, never printed); the build prints the release status and the load balancer address.
      - name: Deploy the release (CodeBuild, command deploy)
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: r${{ github.run_id }}
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
          WAF_ACL_ARN: ${{ inputs.environment == 'prod' && vars.WAF_ACL_ARN || '' }} # dev has no web ACL
        run: |
          set -euo pipefail
          # Outputs of the storage stack (task 5.1); the queue URL carries the account id, so it is masked
          INGEST_QUEUE_URL=$(python scripts/cfn_deploy.py output --env "$ENVIRONMENT" --unit storage --key IngestQueueUrl)
          INGEST_BUCKET=$(python scripts/cfn_deploy.py output --env "$ENVIRONMENT" --unit storage --key IngestBucketName)
          ACCESS_LOG_BUCKET=$(python scripts/cfn_deploy.py output --env "$ENVIRONMENT" --unit storage --key AlbLogBucketName)
          echo "::add-mask::$INGEST_QUEUE_URL"
          echo "::add-mask::$INGEST_BUCKET"
          echo "::add-mask::$ACCESS_LOG_BUCKET"
          export INGEST_QUEUE_URL INGEST_BUCKET ACCESS_LOG_BUCKET
          python scripts/run_deploy_build.py run --env "$ENVIRONMENT" --command deploy \
            --pass IMAGE_DIGEST --pass RUN_ID --pass WEB_ORIGIN --pass COGNITO_USER_POOL_ID \
            --pass COGNITO_APP_CLIENT_ID --pass INGEST_QUEUE_URL --pass INGEST_BUCKET \
            --pass WAF_ACL_ARN --pass ACCESS_LOG_BUCKET

      # Reads the node group, the load balancer and the target groups by tag (the Helm step created them), turns on
      # the node group metric, builds the reminder text and exports both as CFN_PARAM_* for the next step.
      - name: Discover the alarm dimensions and build the reminder
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          cluster=$(python scripts/cfn_deploy.py output --env "$ENVIRONMENT" --unit cluster --key ClusterName)
          python scripts/discover_targets.py --cluster-name "$cluster" --enable-asg-metrics --github-env "$GITHUB_ENV"
          python scripts/reminder_message.py --env "$ENVIRONMENT" --cluster-name "$cluster" --github-env "$GITHUB_ENV" > /dev/null

      - name: Deploy the alarms stack
        if: ${{ !inputs.dry_run }}
        run: python scripts/cfn_deploy.py deploy --env "$ENVIRONMENT" --only "$LAST_UNIT"

      - name: Deployment summary
        if: ${{ success() && !inputs.dry_run }}
        run: |
          {
            echo ""
            echo "### What the owner does next"
            echo "- Confirm the e-mail subscription of the alerts topic (SNS sends a confirmation message to the SUPPORT_EMAIL address)."
            if [ "$ENVIRONMENT" = "dev" ]; then
              echo "- Review the stacks and their tags in the console, then run Destroy DEV in plan mode when finished."
              echo "- Run Deploy DEV in shared-resources so Route 53 reads the new API backend registration (the deployment published /oecalc/dev/api-backends/eks/dns-name and hosted-zone-id)."
            fi
            echo "- The alarms stack sends the alarms, the AWS Health events of EKS and a weekly reminder (first one 7 days after creation) to the same topic."
          } >> "$GITHUB_STEP_SUMMARY"
