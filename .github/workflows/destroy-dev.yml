name: Destroy DEV

# Manual teardown of the dev environment of this repository. There are no approvers (single-user
# organization), so the safety is inside the workflow:
#   1. mode "plan" is the default: it only shows what would be destroyed, nothing is touched;
#   2. mode "destroy" needs the repository name typed in "confirm";
#   3. it runs only from develop (the dev branch) with the dev GitHub environment and the dev AWS account;
#   4. there is no destroy workflow for prod.
# The owner guard (scripts/iac_owner_guard.py detect) finds what owns dev. This repository uses
# CloudFormation only: owner=cloudformation deletes the stacks of templates/stacks.json in reverse deploy
# order (scripts/cfn_deploy.py destroy); owner=none ends green without destroying anything; owner=terraform,
# owner=both or an unreadable owner fails closed.
# Destroy order, all inside scripts/cfn_deploy.py destroy: the Helm uninstall of the calculator release and the
# controllers through the CodeBuild deployment project (the NAT gateway is recreated only for that build), the wait
# until the load balancer, target groups and controller security groups are gone, the removal of the SSM API
# backend registration, then the stacks in reverse order; then the leftover check.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = show what would be destroyed (default); destroy = destroy it"
        type: choice
        options:
          - plan
          - destroy
        default: plan
      confirm:
        description: "Only for mode destroy: type the name of this repository"
        type: string
        required: false

permissions:
  id-token: write # Required for requesting the JWT for AWS OIDC
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  destroy:
    name: Destroy dev
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 120
    # Never run a destroy and a deployment against the same environment at once (same group as the deploy).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      # Only printed next to the detected owner; it never decides what a destroy removes.
      IAC_TOOL_CONFIGURED: ${{ vars.IAC_TOOL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate the request
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Only the develop branch can destroy the dev environment (got $GITHUB_REF)"
            exit 1
          fi
          if [ "$MODE" = "destroy" ] && [ "$CONFIRM" != "$REPO_NAME" ]; then
            echo "::error::To destroy, type the repository name ($REPO_NAME) in the 'confirm' input"
            exit 1
          fi
          echo "Mode: $MODE"

      - name: Validate environment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN_SET: ${{ secrets.ROLE_ARN != '' }}
          AWS_ACCOUNT_ID_SET: ${{ secrets.AWS_ACCOUNT_ID != '' }}
        run: |
          missing=0
          [ -n "$AWS_REGION" ] || { echo "::error::Variable 'AWS_REGION' is not set in the 'dev' GitHub environment"; missing=1; }
          for secret in ROLE_ARN AWS_ACCOUNT_ID; do
            flag="${secret}_SET"
            [ "${!flag}" = "true" ] || { echo "::error::Secret '$secret' is not set in the 'dev' GitHub environment"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          role-session-name: gha-destroy-dev-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify target AWS account
        env:
          EXPECTED_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACTUAL_ACCOUNT"
          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::The credentials do not point to the AWS account configured for the dev GitHub environment"
            exit 1
          fi

      # owner=cloudformation|none goes to the step output; terraform, both (exit 3) or unreadable (exit 4) fails.
      - name: Detect the deployed owner
        id: owner
        run: |
          set -o pipefail
          python3 scripts/iac_owner_guard.py detect --env dev | tee -a "$GITHUB_OUTPUT"

      - name: Owner and IAC_TOOL
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          CONFIGURED="${IAC_TOOL_CONFIGURED:-unset (defaults to cloudformation)}"
          echo "Detected owner of dev: $OWNER. Configured IAC_TOOL: $CONFIGURED."
          echo "Detected owner of dev: **$OWNER**. Configured IAC_TOOL: **$CONFIGURED**." >> "$GITHUB_STEP_SUMMARY"
          if [ "$OWNER" = "terraform" ]; then
            echo "::error::dev is owned by Terraform state, which this repository does not manage. Destroy it from the repository that created it."
            exit 1
          fi

      - name: Nothing is deployed
        if: steps.owner.outputs.owner == 'none'
        run: |
          echo "Nothing is deployed in dev (no CloudFormation stack of this repository)."
          echo "Nothing is deployed in dev." >> "$GITHUB_STEP_SUMMARY"

      # Always runs first. Lists every stack in reverse deploy order with its status, resources, what it would
      # retain and what blocks a delete. Read-only.
      - name: Plan the destruction (CloudFormation)
        if: steps.owner.outputs.owner == 'cloudformation'
        run: python3 scripts/cfn_deploy.py destroy --env dev --mode plan

      # Mode destroy: uninstall through the build project, wait for the load balancer, remove the SSM registration;
      # then per stack: termination protection off, empty this project's buckets and repositories, delete-stack,
      # wait. The scheduler removes the NAT gateway first whether or not it exists. Stops on DELETE_FAILED.
      - name: Destroy (CloudFormation)
        if: ${{ inputs.mode == 'destroy' && steps.owner.outputs.owner == 'cloudformation' }}
        run: python3 scripts/cfn_deploy.py destroy --env dev --mode destroy

      # Closing notice (destroy mode only, runs only when the destroy succeeded). The registration parameters of the
      # shared API edge were removed with this backend; the weighted record lives in shared-resources.
      - name: Closing notice for the owner
        if: ${{ inputs.mode == 'destroy' && steps.owner.outputs.owner == 'cloudformation' }}
        run: |
          MSG="The eks backend is deregistered. Run Deploy DEV of over-engineered-simple-calculator-shared-resources (or wait for its daily drift check) so Route 53 drops the weighted record, and set API_WEIGHT_EKS to 0."
          echo "$MSG"
          {
            echo "### Next step"
            echo ""
            echo "$MSG"
          } >> "$GITHUB_STEP_SUMMARY"

      # Read-only. Lists what the destroy left behind (tagged resources plus untagged kinds). Deletes can lag in
      # the tagging index, so it is retried; tombstones (deleted NAT gateways, deleting clusters) do not count.
      - name: Verify nothing is left behind
        if: ${{ inputs.mode == 'destroy' }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set +e
          python3 scripts/post_destroy_check.py --repo-name "$REPO_NAME" --env dev --region "$AWS_REGION" --retries 4 --wait 60 | tee "$RUNNER_TEMP/post-destroy.txt"
          rc=${PIPESTATUS[0]}
          {
            echo "### Post-destroy check"
            echo '```'
            cat "$RUNNER_TEMP/post-destroy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
