AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  NAT scheduler stack of the EKS backend: Lambda function (code in src/scheduler, packaged by sam build),
  its log group, roles, the failure notification and alarm, and (only when NatSchedulerEnabled is true, dev)
  the two EventBridge Scheduler schedules that remove the NAT gateway and the private default route at night
  and create them again in the morning. The destroy workflow invokes the function with action down.

Parameters:
  EnvType:
    Type: String
    AllowedValues: [dev, prod]
  Context:
    Type: String
    Default: oecalc
    AllowedPattern: "^[a-z0-9]+$"
  RegionCode:
    Type: String
    AllowedPattern: "^[a-z0-9]+$"
  NatSchedulerEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Description: Create the two schedules (true in dev, false in prod where the NAT gateways are always on)
  NatOffSchedule:
    Type: String
    Description: EventBridge Scheduler cron expression that removes the NAT gateway
  NatOnSchedule:
    Type: String
    Description: EventBridge Scheduler cron expression that creates the NAT gateway
  NatTimeZone:
    Type: String
    Description: IANA time zone of both schedules (America/Panama)
  LogRetentionDays:
    Type: Number
  FunctionTimeoutSeconds:
    Type: Number
    Default: 300
    Description: Function timeout; it must cover the wait for the NAT gateway to become available
  # The five mandatory tags: the function copies them to the NAT gateway it creates, and the delete permission
  # is conditioned on them. The deploy script fills these from the Tags section of parameters/<env>.json.
  TagTeamOwner:
    Type: String
  TagProjectName:
    Type: String
  TagAppName:
    Type: String
  TagRepoName:
    Type: String

Conditions:
  SchedulesEnabled: !Equals [!Ref NatSchedulerEnabled, "true"]

Resources:
  # Created here so it has retention, the data key and tags (Lambda would create it without them).
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/fnc-${RegionCode}-${Context}-eks-nat-${EnvType}"
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId:
        Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-security-${EnvType}:DataKeyArn"

  # ---------------------------------------------------------
  # Function role: this NAT gateway, this route table, tagging and its own logs only (D20)
  # ---------------------------------------------------------
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "iamr-${RegionCode}-${Context}-eks-nat-fnc-${EnvType}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  FunctionRolePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: !Sub "iamp-${RegionCode}-${Context}-eks-nat-fnc-${EnvType}"
      RoleName: !Ref FunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The Describe actions do not support resource-level permissions.
          - Sid: ReadNetworkState
            Effect: Allow
            Action:
              - ec2:DescribeNatGateways
              - ec2:DescribeRouteTables
            Resource: "*"
          - Sid: UseTheSubnetAndTheElasticIp
            Effect: Allow
            Action: ec2:CreateNatGateway
            Resource:
              - !Sub
                - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${SubnetId}"
                - SubnetId:
                    Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-network-${EnvType}:PublicSubnetA"
              - !Sub
                - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${AllocationId}"
                - AllocationId:
                    Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-network-${EnvType}:NatEipAllocationId"
          - Sid: CreateTheTaggedNatGateway
            Effect: Allow
            Action: ec2:CreateNatGateway
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:natgateway/*"
            Condition:
              StringEquals:
                aws:RequestTag/Name: !Sub "nat-${RegionCode}-${Context}-eks-${EnvType}"
                aws:RequestTag/env-type: !Ref EnvType
                aws:RequestTag/repo-name: !Ref TagRepoName
          - Sid: TagNatGatewayOnCreate
            Effect: Allow
            Action: ec2:CreateTags
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:natgateway/*"
            Condition:
              StringEquals:
                ec2:CreateAction: CreateNatGateway
          - Sid: DeleteTheTaggedNatGateway
            Effect: Allow
            Action: ec2:DeleteNatGateway
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:natgateway/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Name: !Sub "nat-${RegionCode}-${Context}-eks-${EnvType}"
                aws:ResourceTag/env-type: !Ref EnvType
                aws:ResourceTag/repo-name: !Ref TagRepoName
          - Sid: ManageThePrivateDefaultRoute
            Effect: Allow
            Action:
              - ec2:CreateRoute
              - ec2:ReplaceRoute
              - ec2:DeleteRoute
            Resource: !Sub
              - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/${RouteTableId}"
              - RouteTableId:
                  Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-network-${EnvType}:PrivateRouteTableId"
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "${FunctionLogGroup.Arn}:*"
          - Sid: PublishFailuresToTheAlertsTopic
            Effect: Allow
            Action: sns:Publish
            Resource:
              Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-security-${EnvType}:AlertsTopicArn"
          - Sid: UseTheDataKeyThroughSns
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"
            Condition:
              ForAnyValue:StringEquals:
                kms:ResourceAliases:
                  - Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-security-${EnvType}:DataKeyAlias"
              StringEquals:
                kms:ViaService: !Sub "sns.${AWS::Region}.amazonaws.com"

  # ---------------------------------------------------------
  # Function (no third-party dependencies: boto3 comes with the runtime)
  # ---------------------------------------------------------
  NatSchedulerFunction:
    Type: AWS::Serverless::Function
    DependsOn: FunctionRolePolicy
    Properties:
      FunctionName: !Sub "fnc-${RegionCode}-${Context}-eks-nat-${EnvType}"
      Role: !GetAtt FunctionRole.Arn
      Runtime: python3.14
      Architectures: [arm64]
      Handler: app.handler
      Timeout: !Ref FunctionTimeoutSeconds
      MemorySize: 128
      CodeUri: ../src/scheduler
      Environment:
        Variables:
          PUBLIC_SUBNET_ID:
            Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-network-${EnvType}:PublicSubnetA"
          PRIVATE_ROUTE_TABLE_ID:
            Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-network-${EnvType}:PrivateRouteTableId"
          EIP_ALLOCATION_ID:
            Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-network-${EnvType}:NatEipAllocationId"
          NAME_TAG: !Sub "nat-${RegionCode}-${Context}-eks-${EnvType}"
          TAGS_JSON: !Sub '{"app-name":"${TagAppName}","env-type":"${EnvType}","project-name":"${TagProjectName}","repo-name":"${TagRepoName}","team-owner":"${TagTeamOwner}"}'
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref FunctionLogGroup
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure:
            Type: SNS
            Destination:
              Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-security-${EnvType}:AlertsTopicArn"

  # ---------------------------------------------------------
  # EventBridge Scheduler: down at night, up in the morning (dev only; invoke only this function)
  # ---------------------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: SchedulesEnabled
    Properties:
      RoleName: !Sub "iamr-${RegionCode}-${Context}-eks-nat-sch-${EnvType}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"

  SchedulerRolePolicy:
    Type: AWS::IAM::RolePolicy
    Condition: SchedulesEnabled
    Properties:
      PolicyName: !Sub "iamp-${RegionCode}-${Context}-eks-nat-sch-${EnvType}"
      RoleName: !Ref SchedulerRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeOnlyTheNatScheduler
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt NatSchedulerFunction.Arn

  DownSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: SchedulesEnabled
    DependsOn: SchedulerRolePolicy
    Properties:
      Name: !Sub "sch-${RegionCode}-${Context}-eks-nat-down-${EnvType}"
      Description: Remove the NAT gateway and the private default route at night
      ScheduleExpression: !Ref NatOffSchedule
      ScheduleExpressionTimezone: !Ref NatTimeZone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt NatSchedulerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"action":"down"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  UpSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: SchedulesEnabled
    DependsOn: SchedulerRolePolicy
    Properties:
      Name: !Sub "sch-${RegionCode}-${Context}-eks-nat-up-${EnvType}"
      Description: Create the NAT gateway and the private default route in the morning
      ScheduleExpression: !Ref NatOnSchedule
      ScheduleExpressionTimezone: !Ref NatTimeZone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt NatSchedulerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"action":"up"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  # ---------------------------------------------------------
  # Alarm on function errors (a failed invocation raises, see src/scheduler/app.py)
  # ---------------------------------------------------------
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "alm-${RegionCode}-${Context}-eks-nat-errors-${EnvType}"
      AlarmDescription: "The NAT scheduler function failed: the NAT gateway and the private default route may be inconsistent"
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref NatSchedulerFunction
      AlarmActions:
        - Fn::ImportValue: !Sub "stk-${RegionCode}-${Context}-eks-security-${EnvType}:AlertsTopicArn"

Outputs:
  FunctionName:
    Description: Name of the NAT scheduler function (the destroy workflow invokes it with action down)
    Value: !Ref NatSchedulerFunction
  FunctionArn:
    Value: !GetAtt NatSchedulerFunction.Arn
  NatNameTag:
    Description: Name tag of the NAT gateway created by the function
    Value: !Sub "nat-${RegionCode}-${Context}-eks-${EnvType}"
