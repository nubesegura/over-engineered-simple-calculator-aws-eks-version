{{- /* One service account per identity (calc, history, migrate). Pod Identity associations need no annotation. */}}
{{- range $name := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "calc.namespace" $ }}
  labels:
    {{- include "calc.labels" (dict "root" $ "name" $name "component" "identity") | nindent 4 }}
  # Helm ownership metadata: these accounts are applied before the release (the migration Job needs the `migrate`
  # account), so the release must be able to adopt them (kubectl apply of this template, then helm install).
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace }}
automountServiceAccountToken: false
{{- end }}
