{{- /* One service account per identity (calc, history, migrate). Pod Identity associations need no annotation. */}}
{{- range $name := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "calc.namespace" $ }}
  labels:
    {{- include "calc.labels" (dict "root" $ "name" $name "component" "identity") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
