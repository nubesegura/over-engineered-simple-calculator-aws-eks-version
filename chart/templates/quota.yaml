# D16: a namespace-wide ceiling (autoscaling cannot grow without limit) and per-container bounds below the size
# of one node.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: calculator-quota
  namespace: {{ include "calc.namespace" . }}
  labels:
    {{- include "calc.labels" (dict "root" . "name" "calculator-quota" "component" "policy") | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: calculator-limits
  namespace: {{ include "calc.namespace" . }}
  labels:
    {{- include "calc.labels" (dict "root" . "name" "calculator-limits" "component" "policy") | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.limitRange.default.cpu | quote }}
        memory: {{ .Values.limitRange.default.memory | quote }}
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequest.cpu | quote }}
        memory: {{ .Values.limitRange.defaultRequest.memory | quote }}
      min:
        cpu: {{ .Values.limitRange.min.cpu | quote }}
        memory: {{ .Values.limitRange.min.memory | quote }}
      max:
        cpu: {{ .Values.limitRange.max.cpu | quote }}
        memory: {{ .Values.limitRange.max.memory | quote }}
