# Environment values: dev. Placeholders are overridden by the deployment script (--set); no account ids here.
envType: dev

replicaCount: 1

app:
  allowedOrigin: https://dev.example.invalid
  logLevel: INFO   # pods log at INFO in dev too: DEBUG is a temporary owner override (--set-string app.logLevel=DEBUG)

network:
  vpcCidr: 10.30.0.0/16   # parameters/dev.json VpcCidr
  albCidrs: [10.30.1.0/24, 10.30.2.0/24]   # public subnets (VpcCidr slices 1, 2)
  databaseCidrs: [10.30.11.0/24, 10.30.12.0/24]   # private subnets (slices 11, 12)

# No WAF in dev
ingress:
  wafAclArn: ""
