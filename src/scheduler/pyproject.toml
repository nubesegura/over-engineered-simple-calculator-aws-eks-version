[project]
name = "nat_scheduler"
version = "0.1.0"
description = "Lambda that removes and creates the NAT gateway of the dev VPC on a schedule"
requires-python = ">=3.14"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]
"**/tests/**" = ["S101", "S105", "S108", "S603", "S607"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]
